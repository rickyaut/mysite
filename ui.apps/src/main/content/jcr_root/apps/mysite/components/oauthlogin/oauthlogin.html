<div class="auth-forms">
    <div class="signup-form">
        <h3>Sign Up</h3>
        <form id="signupForm">
            <input type="text" name="fullName" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign Up</button>
        </form>
    </div>
    
    <div class="login-form">
        <h3>Login</h3>
        <form id="loginForm">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
    
    <div class="oauth-login">
        <h3>Or sign in with</h3>
        <div class="oauth-buttons">
            <a href="/bin/oauth/login?provider=google" class="oauth-btn google-btn">Google</a>
            <a href="/bin/oauth/login?provider=facebook" class="oauth-btn facebook-btn">Facebook</a>
            <a href="/bin/oauth/login?provider=azure" class="oauth-btn azure-btn">Microsoft</a>
        </div>
    </div>
</div>

<script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const response = await fetch('/bin/auth/signup', {
        method: 'POST',
        body: new URLSearchParams(formData)
    });
    const result = await response.json();
    alert(result.message);
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const response = await fetch('/bin/auth/login', {
        method: 'POST',
        body: new URLSearchParams(formData)
    });
    const result = await response.json();
    if (result.success) window.location.href = '/content/mysite/us/en.html';
});
</script>
